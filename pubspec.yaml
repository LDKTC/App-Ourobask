name: ourobask
description: "Ourobask - แอปเก็บ Task / Work / Idea พร้อมการแจ้งเตือนและปลุก"
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # storage
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # state
  provider: ^6.1.5

  # notifications / alarm
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

  # files (custom alarm sound, export/import)
  file_picker: ^10.3.3
  share_plus: ^12.0.0

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
