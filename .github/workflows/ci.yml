name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-and-build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting-independent analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          exit $code

      # อ่าน log ของ runner จากที่นี่ไม่ได้ทันเวลา จึงส่งท้าย log กลับมาที่ PR เมื่อ build ล้ม
      - name: Report build failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Android release build failed on \`${GITHUB_SHA}\`. Tail of the Gradle output:"
            echo
            echo '```'
            tail -n 60 build.log || echo '(no build.log produced)'
            echo '```'
            echo
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > comment.md
          jq -Rs '{body: .}' comment.md > payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --data @payload.json > /dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ourobask-debug-build
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
